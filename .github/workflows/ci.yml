name: Nexo Hub CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Run Unit & Integration Tests
      run: go test -v -race ./...

    - name: Build Binary
      run: go build -v -o bin/nexo ./cmd/nexo/main.go
